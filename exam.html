<!DOCTYPE html>
<html lang="zh-Hans">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>电子考试</title>

    <link rel="stylesheet" href="css/exam.css">
</head>
<script src="js/exam.js"></script>
<body>

    <!-- Header -->
    <header class="header">

        <div id="paperTitle" class="paper-title">
            练习一
        </div>

        <div class="timer">
            剩余时间：
            <span id="timer">01:50:00</span>
        </div>

    </header>

    <!-- Candidate Information -->
    <div class="candidate-bar">

        <div>
            考生：
            <span id="studentName"></span>
        </div>

        <div>
            已作答：
            <span id="answeredCount">0</span> /
            <span id="totalQuestions">29</span>
        </div>

    </div>

    <!-- Navigation -->
    <nav class="navigation-bar">

        <select id="sectionSelector">

            <option value="section1">
                综合填空
            </option>

            <option value="section2">
                阅读理解（一）
            </option>

            <option value="section3">
                阅读理解（二）
            </option>

        </select>

        <button id="previousButton">
            ← 上一题
        </button>

        <div id="questionPalette">

            <!-- Generated by exam.js -->

        </div>

        <button id="nextButton">
            下一题 →
        </button>

    </nav>

    <!-- Main Exam Area -->
    <main class="exam-area">

        <!-- Passage -->
        <section class="passage-panel">

            <div id="passageContent">
                <h2>测试</h2>
                <p>如果你能看到这一段，说明左侧面板本身是正常的。</p>
            </div>

        </section>

        <!-- Question -->
        <section class="question-panel">

            <div id="questionContent">

                <!-- Question loaded here -->

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="footer">

        <button id="markButton">
            标记此题
        </button>

        <button id="submitButton">
            交卷
        </button>

    </footer>

    <script src="js/exam.js"></script>

</body>

</html>
