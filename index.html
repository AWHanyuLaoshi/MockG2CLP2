<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G2华文试卷二电子考试模拟练习</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h1>G2华文试卷二电子考试模拟练习</h1>

        <p class="subtitle">
            欢迎使用电子考试模拟练习系统。
        </p>

        <div class="form-group">
            <label for="studentName">姓名</label>
            <input
                type="text"
                id="studentName"
                placeholder="请输入学生姓名"
                autocomplete="off">
        </div>

        <div class="form-group">
            <label for="paperCode">练习码</label>
            <input
                type="text"
                id="paperCode"
                placeholder="请输入试卷代码"
                autocomplete="off">
        </div>

        <button onclick="startLogin()">继续</button>

    </div>

    <script src="js/login.js"></script>

</body>
</html>
